<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Nightwatch</title>
  <desc id="d">Safer walking routes after dark, scored by streetlight density.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="1" stop-color="#141a36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#5b9bff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#sky)"/>
  <g fill="#cfd8ff" opacity="0.7">
    <circle cx="90" cy="40" r="1.5"/><circle cx="210" cy="95" r="1"/><circle cx="330" cy="30" r="1.2"/>
    <circle cx="470" cy="70" r="1"/><circle cx="640" cy="28" r="1.5"/><circle cx="760" cy="85" r="1"/>
    <circle cx="905" cy="40" r="1.3"/><circle cx="1010" cy="105" r="1"/><circle cx="1180" cy="55" r="1.5"/>
  </g>
  <circle cx="1130" cy="70" r="26" fill="#e8ecff" opacity="0.9"/>
  <circle cx="1140" cy="64" r="24" fill="#0b1022"/>
  <g fill="#0a0e1d">
    <rect x="0" y="220" width="1280" height="100"/>
    <rect x="720" y="170" width="60" height="150"/><rect x="790" y="140" width="80" height="180"/>
    <rect x="880" y="190" width="50" height="130"/><rect x="940" y="150" width="70" height="170"/>
    <rect x="1020" y="195" width="60" height="125"/><rect x="1090" y="160" width="90" height="160"/>
    <rect x="1190" y="200" width="90" height="120"/>
  </g>
  <path d="M0 292 C 220 292 300 262 520 262 S 860 292 1280 276" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" opacity="0.9"/>
  <g>
    <circle cx="560" cy="150" r="90" fill="url(#glow)"/>
    <rect x="557" y="150" width="6" height="130" fill="#2a3150"/>
    <rect x="557" y="150" width="34" height="5" rx="2" fill="#2a3150"/>
    <circle cx="590" cy="160" r="7" fill="#ffe3a3"/>
  </g>
  <g>
    <circle cx="300" cy="190" r="70" fill="url(#glow)" opacity="0.7"/>
    <rect x="297" y="190" width="5" height="90" fill="#2a3150"/>
    <rect x="297" y="190" width="28" height="4" rx="2" fill="#2a3150"/>
    <circle cx="324" cy="198" r="6" fill="#ffe3a3"/>
  </g>
  <text x="64" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#f2f4ff" letter-spacing="-1">Nightwatch</text>
  <text x="68" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#aeb8e6">Walk the safest route home, not just the shortest.</text>
  <rect x="68" y="214" width="96" height="4" rx="2" fill="url(#accent)"/>
</svg>
